/* Layout idea: a calm work desk. Maroon rail on the left, white working surface, state shown as pills. */
:root{
  --accent:#7A2335; --accent-ink:#ffffff; --accent-soft:#F6E9EC;
  --ink:#1E1A1C; --muted:#6B6468; --line:#E6E1E3; --surface:#FFFFFF; --bg:#F7F5F6; --rail:#5E1A29;
  --good:#1F7A4D; --good-soft:#E3F3EA; --warn:#A86200; --warn-soft:#FBF0DC; --bad:#B42335; --bad-soft:#FBE6E8;
  --info:#2756B8; --info-soft:#E6EDFB; --violet:#6A3FB5; --violet-soft:#EFE8FA; --teal:#127A78; --teal-soft:#E0F3F2;
  --font-display:"Readex Pro","IBM Plex Sans",system-ui,sans-serif;
  --font-body:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --accent:#D9667C; --accent-ink:#1A0E11; --accent-soft:#3A1E25;
  --ink:#F1ECEE; --muted:#A79EA2; --line:#3A3337; --surface:#221D20; --bg:#181416; --rail:#2A1218;
  --good:#5CC48F; --good-soft:#18352A; --warn:#E3A84A; --warn-soft:#3A2D16; --bad:#F07A88; --bad-soft:#3D1D22;
  --info:#7FA4F0; --info-soft:#1C2740; --violet:#B395EE; --violet-soft:#2B2240; --teal:#5CC9C6; --teal-soft:#16302F; color-scheme:dark;}}
:root[data-theme="dark"]{
  --accent:#D9667C; --accent-ink:#1A0E11; --accent-soft:#3A1E25;
  --ink:#F1ECEE; --muted:#A79EA2; --line:#3A3337; --surface:#221D20; --bg:#181416; --rail:#2A1218;
  --good:#5CC48F; --good-soft:#18352A; --warn:#E3A84A; --warn-soft:#3A2D16; --bad:#F07A88; --bad-soft:#3D1D22;
  --info:#7FA4F0; --info-soft:#1C2740; --violet:#B395EE; --violet-soft:#2B2240; --teal:#5CC9C6; --teal-soft:#16302F; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.55}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;font-weight:600}
h1{font-size:22px} h2{font-size:16px} h3{font-size:14px}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td.n,.kpi b{font-variant-numeric:tabular-nums}
.ar{font-family:"IBM Plex Sans Arabic",var(--font-body)}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100%}
.rail{background:var(--rail);color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;flex-direction:column;padding:0 8px 14px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:8px}
.brand{flex-direction:row!important;align-items:center;gap:10px}
.brand img{width:46px;height:46px;object-fit:contain;flex:none}
.brand div{display:flex;flex-direction:column;min-width:0}
.brand b{font-family:var(--font-display);font-size:16px;line-height:1.25}
.auth-logo{display:flex;align-items:center;gap:14px}.auth-logo img{width:72px;height:72px;object-fit:contain}
.brand span{opacity:.7;font-size:12px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:rgba(255,255,255,.82);text-decoration:none;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.08)}
.nav a.on{background:#fff;color:var(--rail)}
.rail .me{margin-top:auto;font-size:12px;padding:10px 8px;border-top:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;gap:6px}
.rail .me b{display:block;font-size:13px}
.rail .me button{background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:7px;padding:5px 9px;cursor:pointer;text-align:start}
.rail .me button:hover{background:rgba(255,255,255,.18)}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top .sp{flex:1}
.page{padding:22px 24px 60px;display:flex;flex-direction:column;gap:18px}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head .sub{color:var(--muted);font-size:13px}
.head .sp,.sp{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.card>h2{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi span{color:var(--muted);font-size:12px;display:block}
.kpi b{font-family:var(--font-display);font-size:24px;font-weight:600;display:block;margin-top:2px}
.kpi small{color:var(--muted);font-size:12px}
.kpi.alert{border-color:var(--bad);background:var(--bad-soft)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 13px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.inp,select.inp,textarea.inp{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 10px;min-width:0}
textarea.inp{width:100%;resize:vertical}
.field{display:flex;flex-direction:column;gap:4px}
.field>label{font-size:12.5px;color:var(--muted);font-weight:500}
.field>label i{color:var(--bad);font-style:normal}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.field{flex:1;min-width:150px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:start;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--bg)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--bg)}
td .s{color:var(--muted);font-size:12px;display:block}
.pill{display:inline-block;border-radius:20px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--bg);color:var(--muted)}
.pill.blue{background:var(--info-soft);color:var(--info)} .pill.green{background:var(--good-soft);color:var(--good)}
.pill.red{background:var(--bad-soft);color:var(--bad)} .pill.amber{background:var(--warn-soft);color:var(--warn)}
.pill.violet{background:var(--violet-soft);color:var(--violet)} .pill.teal{background:var(--teal-soft);color:var(--teal)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 13px;cursor:pointer;font-weight:500}
.tabs button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.bar{height:8px;border-radius:5px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.bars{display:flex;flex-direction:column;gap:9px}
.bars .l{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px;gap:8px}
.cols{display:flex;align-items:flex-end;gap:3px;height:140px;padding-top:10px;border-bottom:1px solid var(--line)}
.cols div{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:1px;position:relative}
.cols div:hover{opacity:.8}
.cols-x{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.note{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:13px}
.note.info{background:var(--info-soft);color:var(--info)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.good{background:var(--good-soft);color:var(--good)}
.hint{font-size:12px;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(20,10,14,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.wide{max-width:900px}
.modal .mh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal .mh h2{flex:1}
.modal .mb{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:10px;padding:12px;flex-wrap:wrap}
.who .nm{font-size:15px;font-weight:600;display:block}
.timeline{display:flex;flex-direction:column;gap:2px}
.tl{border-inline-start:3px solid var(--line);padding:6px 12px;position:relative}
.tl::before{content:"";position:absolute;left:-7px;top:11px;width:11px;height:11px;border-radius:50%;background:var(--surface);border:2px solid var(--line)}
.tl.k-created::before{border-color:var(--info)} .tl.k-call::before{border-color:var(--muted)} .tl.k-reserved::before{border-color:var(--good);background:var(--good)}
.tl.k-payment::before{border-color:var(--good)} .tl.k-refund::before{border-color:var(--bad);background:var(--bad)}
.tl.k-group_joined::before{border-color:var(--violet);background:var(--violet)} .tl.k-reassigned::before{border-color:var(--warn)}
.tl .m{font-size:12px;color:var(--muted)}
.stages{display:flex;gap:4px;flex-wrap:wrap}
.stages span{flex:1;min-width:90px;text-align:center;font-size:12px;font-weight:600;padding:6px 4px;border-radius:7px;background:var(--bg);color:var(--muted)}
.stages span.on{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:13px;background:var(--surface);cursor:pointer}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.chip input{margin:0}
.check{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line)}
.check:last-child{border-bottom:0}
.check input{margin-top:4px;width:17px;height:17px;accent-color:var(--good)}
.cmp{font-size:12px;color:var(--muted)} .cmp.diff{color:var(--warn);font-weight:600}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:10px;z-index:80;font-weight:500;max-width:90vw}
.center{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.center .card{max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px}
.dist{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;color:var(--muted);font-size:13px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.cal{border-collapse:separate;border-spacing:2px;width:auto}
.cal th,.cal td{padding:0;border:0;text-align:center;font-size:11px}
.cal th,.cal td.nm{background:none}
.cal th{color:var(--muted);font-weight:600;min-width:24px;padding:2px}
.cal th.nm,.cal td.nm{text-align:start;padding:4px 10px 4px 0;font-size:13px;white-space:nowrap;min-width:150px}
.cal td.d{width:24px;height:24px;border-radius:5px;font-weight:600;cursor:default}
.d-A{background:var(--good-soft);color:var(--good)} .d-X{background:var(--bad-soft);color:var(--bad)} .d-L{background:var(--info-soft);color:var(--info)}
.d-O{background:var(--bg);color:var(--muted)} .d-W{background:var(--good);color:#fff} .d-N{background:transparent;color:var(--line)} .d-F{background:transparent;color:var(--muted)} .d-P{background:var(--warn-soft);color:var(--warn)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px}
.slog{border-collapse:separate;border-spacing:0}
.slog th{position:sticky;top:0;z-index:2;min-width:150px;vertical-align:bottom}
.slog th .s{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.slog th.dt,.slog td.dt{position:sticky;left:0;z-index:3;background:var(--surface);min-width:90px;border-right:1px solid var(--line)}
.slog th.dt{background:var(--bg);z-index:4}
.slog td{min-width:150px;padding:6px 8px;border-left:1px solid var(--line);font-size:12.5px}
.slog td.offc{background:var(--bg)} .slog td.offc:empty::after{content:'Day off';color:var(--muted);font-size:11px}
.pcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.pcal .wd{font-size:11px;font-weight:600;color:var(--muted);text-align:center;padding:2px 0}
.pc{min-height:78px;border-radius:9px;padding:6px 7px;font-size:11.5px;display:flex;flex-direction:column;gap:2px;border:1px solid transparent;overflow:hidden}
.pc b.n{font-size:13px}.pc .st{font-weight:600}.pc .lg{font-size:11px;padding:2px 5px;margin:1px 0}
.pc.d-N,.pc.d-F{border-color:var(--line)} .pc.blank{background:none;border:0}
.pc.today{outline:2px solid var(--accent);outline-offset:-2px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.rcard{text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;font:inherit;color:inherit}.rcard:hover{border-color:var(--accent)}
.rnums{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.rnums div{background:var(--bg);border-radius:8px;padding:6px 8px}.rnums b{display:block;font-size:17px}.rnums span{font-size:11px;color:var(--muted)}
.sheet-wrap{max-height:70vh;overflow:auto}.sheet{font-size:12.5px;min-width:1500px}.sheet th{position:sticky;top:0;z-index:1;background:var(--surface)}
.sheet td{padding:6px 8px;vertical-align:top}.sheet td.c-notes{min-width:260px;max-width:380px}.sheet td.c-email{font-size:11.5px}.sheet td.c-name{font-weight:600;min-width:150px}
.sheet td.c-location{min-width:170px}.rst{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.tabs button.tab-warn{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}.tabs button.tab-warn.on{background:var(--warn);color:#fff}.locpick{min-width:170px;padding:4px 8px;font-size:13px;border-color:var(--warn);background:var(--warn-soft)}
.mark{unicode-bidi:isolate;direction:ltr;display:inline-block;font-size:11.5px;font-weight:600;color:var(--muted);margin-inline-start:8px;white-space:nowrap}.mark.due{color:var(--bad)}.fu-due{color:var(--bad);font-weight:600}
.rgroup{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}.rgroup h3{margin:0}
.rembar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 4px;padding:10px 14px;border-radius:10px;background:var(--bad-soft);border:1px solid var(--bad);color:var(--bad)}.rembar b{white-space:nowrap}.rembar .ar{color:var(--ink)}
.nbadge{display:inline-block;min-width:20px;padding:1px 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;text-align:center;margin-inline-start:6px;opacity:.85}
tr.due-row td:first-child{box-shadow:inset 4px 0 0 var(--bad)}tr.due-row{background:var(--bad-soft)}tr.due-head td{background:var(--bad);color:#fff;font-weight:600;padding:6px 12px}
.due-pill{background:var(--bad)!important;color:#fff!important;display:table;margin-bottom:4px;white-space:normal}.fuq{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{border:0;background:var(--surface);padding:7px 12px;font:inherit;font-size:13px;cursor:pointer;border-inline-end:1px solid var(--line)}.seg button:last-child{border-inline-end:0}.seg button.on{background:var(--accent);color:#fff}
.sumtabs{display:flex;gap:6px;margin-bottom:8px}.sumtabs button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}.sumtabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.gsum{width:100%;border-collapse:collapse}.gsum th,.gsum td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:start}.gsum td.num,.gsum th.num{text-align:center}.gsum tr.on td{background:var(--accent-soft,#eef2ff)}.gsum tr.tot td{border-top:2px solid var(--line);background:var(--bg)}
.rlegend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}.rlegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}
.pstats{display:flex;flex-wrap:wrap;gap:8px}.pstats div{background:var(--bg);border-radius:10px;padding:8px 12px;min-width:92px}.pstats b{display:block;font-size:18px}.pstats span{font-size:12px;color:var(--muted)}
.cal td.nm a{color:inherit;text-decoration:underline dotted;cursor:pointer}
[data-sv] .sv-flag{display:none} [data-sv].dirty .sv-flag{display:inline-flex}
.card[data-sv].dirty{box-shadow:0 0 0 2px var(--warn-soft);border-color:var(--warn)}
tr[data-sv].dirty td{background:var(--warn-soft)}
.sv-row{display:flex;align-items:center;gap:10px;margin-top:10px}
.slog td.na{background:repeating-linear-gradient(45deg,transparent 0 6px,var(--bg) 6px 12px)}
.slog td.cell{cursor:pointer} .slog td.cell:hover{outline:2px solid var(--accent);outline-offset:-2px}
.lg{display:block;border-radius:6px;padding:3px 7px;margin:2px 0;font-weight:600;font-size:12px}
.lg em{display:block;font-style:normal;font-weight:400}
.lg b{float:right;font-weight:700}
.lg.leave{background:var(--info-soft);color:var(--info)} .lg.violation{background:var(--bad-soft);color:var(--bad)} .lg.note{background:var(--bg);color:var(--ink)}
.lg.auto{background:transparent;color:var(--muted);border:1px dashed var(--muted);font-weight:500}
.menu-btn{display:none}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;top:0;bottom:0;left:0;width:250px;z-index:60;transform:translateX(-100%);transition:transform .2s}
  .rail.open{transform:none}
  .menu-btn{display:inline-flex}
  .page{padding:16px 16px 60px}
  .top{padding:10px 16px}
  table.cards thead{display:none}
  table.cards tr{display:block;border-bottom:1px solid var(--line);padding:8px 0}
  table.cards td{display:flex;gap:10px;border:0;padding:4px 12px}
  table.cards td[data-l]::before{content:attr(data-l);color:var(--muted);font-size:12px;min-width:90px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
"use strict";
/* ================= constants ================= */
const CFG=window.SALES_DESK_CONFIG||{};
const STATUSES=[{k:'New',c:'blue'},{k:'No Answer',c:''},{k:'Not Available',c:''},{k:'Call Later',c:'amber'},{k:'Send Details WP',c:'teal'},{k:'Possible Lead',c:'violet'},{k:'Not Interested',c:'red'},{k:'Reserved',c:'green'}];

const NO_REACH=['No Answer','Not Available'];
const QUAL_DEFAULT={'Call Later':true,'Send Details WP':true,'Possible Lead':true,'Reserved':true,'Not Interested':false};
const GROUPS=[['round','Round'],['station','Sales Station'],['interested','Interested'],['reserved','Reserved']];

const ROLES={admin:'Admin',tl:'Team Leader',agent:'Agent',ops:'Rounds (Operations)'};
const RESULTS={passed:{t:'Passed',c:'green'},again:{t:'Come back again',c:'amber'},noshow:{t:'No-show',c:''},failed:{t:'Not a fit',c:'red'}};
const ISTATUS={pending:{t:'Under review',c:'amber'},accepted:{t:'Accepted',c:'green'},rejected:{t:'Rejected',c:'red'}};
const RSTATUS={Active:'green',Cancelled:'red',Refunded:'amber',Completed:'blue'};
/* the academy only takes (and refunds) money through these two */
const METHODS=['Vodafone Cash','InstaPay'];
const REFUND_METHODS=['Vodafone Cash','InstaPay'];
const REFUND_TYPES={overpaid:'Paid more than the course price',cancelled:'Cancelled: refund what they paid',other:'Other'};
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const PAGE=50;
const PERIODS=[['today','Today'],['yesterday','Yesterday'],['7','Last 7 days'],['30','Last 30 days'],['month','This month'],['lastmonth','Last month'],['90','Last 90 days']];

/* ================= state ================= */
const S={sb:null,session:null,me:null,profiles:{},settings:{},courses:[],groups:[],view:'',period:'30',
  d:{},loading:false,f:{q:'',status:'',course:'',agent:'',platform:'',tab:'all',page:0},sel:new Set(),imp:null,
  rf:{date:'',tab:'daily'},inf:{q:'',st:''},resf:{status:'',agent:''},att:{month:''},hasAdmin:null,authMode:'login'};

/* ================= utils ================= */
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dstr(new Date());
const nowISO=()=>new Date().toISOString();
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return dstr(d)};
const startISO=s=>parseD(s).toISOString();
const endISO=s=>parseD(addDays(s,1)).toISOString();
const dayOf=iso=>dstr(new Date(iso));
const dm=s=>{if(!s)return '';const [y,m,d]=s.split('-');return (+d)+'/'+(+m)};
const fmtDay=s=>s?parseD(s).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:parseD(s).getFullYear()===new Date().getFullYear()?undefined:'numeric'}):'—';
const fmtTime=iso=>iso?new Date(iso).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):'';
const hhmm=iso=>{const d=new Date(iso);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const CLOSED_ST=['Reserved','Not Interested'];
/* a follow-up is due when its time has come (or, with no time, its day has come) and nobody has logged a call since it was set */
const fuDue=l=>!!l&&!CLOSED_ST.includes(l.status)&&(l.follow_up_at?new Date(l.follow_up_at)<=new Date():!!l.follow_up&&l.follow_up<=today());
const fuLabel=l=>l.follow_up_at?(dayOf(l.follow_up_at)===today()?'Today ':fmtDay(dayOf(l.follow_up_at))+' ')+fmtTime(l.follow_up_at):l.follow_up?fmtDay(l.follow_up):'';
const dueOr=()=>`follow_up_at.lte.${new Date().toISOString()},and(follow_up_at.is.null,follow_up.lte.${today()})`;
/* a small mark next to the client's name: ⏰ for call-backs, a red dot for follow-ups */
const fuMark=l=>{if(CLOSED_ST.includes(l.status)||!(l.follow_up||l.follow_up_at))return '';const due=fuDue(l),cl=l.status==='Call Later';
  if(!due&&!cl)return '';const tip=(cl?'Call back ':'Follow-up ')+fuLabel(l)+(due?' — not called yet':'');
  return `<span class="mark ${due?'due':''}" title="${esc(tip)}">${cl?'⏰ '+esc(l.follow_up_at?fmtTime(l.follow_up_at):'Call later'):'● Follow-up'}</span>`};
const fmtWhen=iso=>{if(!iso)return '—';const d=dayOf(iso),t=today();if(d===t)return 'Today '+fmtTime(iso);if(d===addDays(t,-1))return 'Yesterday '+fmtTime(iso);return fmtDay(d)+' '+fmtTime(iso)};
const nf=n=>(+n||0).toLocaleString('en-US');
const egp=n=>'EGP '+nf(Math.round(+n||0));
const pct=(a,b)=>b?Math.round(a*1000/b)/10+'%':'—';
const plural=(n,w)=>nf(n)+' '+w+(n===1?'':'s');
const daysBetween=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5)+1;
function normPhone(raw){
  if(raw==null)return null;
  let s=String(raw).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/\D/g,'');
  if(s.startsWith('00'))s=s.slice(2);
  if(s.startsWith('20')&&s.length===12)s=s.slice(2);
  else if(s.startsWith('0')&&s.length===11)s=s.slice(1);
  return /^1[0125]\d{8}$/.test(s)?'+20'+s:null;
}
const normGov=g=>{g=String(g||'').trim();if(!g)return '';if(GOVS.includes(g))return g;if(GOV_AR[g])return GOV_AR[g];return GOVS.find(x=>x.toLowerCase()===g.toLowerCase())||''};
const waLink=p=>'https://wa.me/'+String(p).replace(/\D/g,'');
const pill=k=>`<span class="pill ${ST[k]?ST[k].c:''}">${esc(k||'—')}</span>`;
const pname=id=>id?(S.profiles[id]?.name||'—'):'Unassigned';
const isMgr=()=>S.me&&(S.me.role==='admin'||S.me.role==='tl');
const isAdmin=()=>S.me&&S.me.role==='admin';
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3000)}
async function copyText(txt){try{await navigator.clipboard.writeText(txt);toast('Copied ✓')}catch(e){toast("Couldn't copy. Select the text and copy it manually.")}}
function periodRange(p){p=p||S.period;const t=today();
  if(p==='today')return [t,t];
  if(p==='yesterday'){const y=addDays(t,-1);return [y,y]}
  if(p==='month')return [t.slice(0,8)+'01',t];
  if(p==='lastmonth'){const d=parseD(t.slice(0,8)+'01');d.setDate(0);const e=dstr(d);return [e.slice(0,8)+'01',e]}
  return [addDays(t,-(+p-1)),t];}
const periodName=()=>PERIODS.find(p=>p[0]===S.period)[1];
function genPassword(){const c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';let s='';const a=new Uint32Array(10);crypto.getRandomValues(a);a.forEach(x=>s+=c[x%c.length]);return s}
function myAgents(){const all=Object.values(S.profiles).filter(p=>p.active&&p.role==='agent');
  if(isAdmin())return all.sort((a,b)=>a.name.localeCompare(b.name));
  if(S.me.role==='tl')return all.filter(p=>p.tl_id===S.me.id).sort((a,b)=>a.name.localeCompare(b.name));
  return all.filter(p=>p.id===S.me.id);}
function visibleStaff(){const all=Object.values(S.profiles);if(isAdmin())return all;if(S.me.role==='tl')return all.filter(p=>p.id===S.me.id||p.tl_id===S.me.id);return all.filter(p=>p.id===S.me.id)}
function csvDownload(name,rows){
  const txt='﻿'+rows.map(r=>r.map(v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}

/* ================= data helpers ================= */
async function Q(p){const {data,error,count}=await p;if(error)throw error;return count!=null?{data,count}:data}
async function all(build){let out=[],from=0;for(;;){const {data,error}=await build().range(from,from+999);if(error)throw error;out=out.concat(data||[]);if(!data||data.length<1000)break;from+=1000;if(from>200000)break}return out}
function errMsg(e){const m=(e&&(e.message||e.error_description))||String(e);
  if(/row-level security|permission denied/i.test(m))return "You don't have permission to do that.";
  if(/duplicate key.*daily_reports/i.test(m))return 'There is already a report for that day.';
  if(/Failed to fetch|NetworkError/i.test(m))return "Can't reach the server. Check your internet connection.";
  return m;}
async function guard(fn,ok){try{const r=await fn();if(ok)toast(ok);return r==null?true:r}catch(e){console.error(e);toast(errMsg(e));return false}}
async function addEvent(lead_id,type,o={}){return Q(S.sb.from('lead_events').insert({lead_id,type,by:S.me.id,status:o.status||null,comment:o.comment||null,data:o.data||null}))}
/* seats taken per group = students in that group who are still in the round (from the round sheet) */
async function loadSeats(){try{const {data,error}=await S.sb.rpc('group_seats');if(error)throw error;S.seats=Object.fromEntries((data||[]).map(r=>[r.group_id,r.taken]))}catch(e){console.warn('seats',e);S.seats=S.seats||{}}}
const seatOf=g=>{const taken=(S.seats||{})[g.id]||0;return {taken,cap:g.capacity||null,full:!!g.capacity&&taken>=g.capacity,left:g.capacity?Math.max(0,g.capacity-taken):null}};
/* the Settings group a round-sheet row belongs to: same round, same place (and the same time when the place has more than one) */
function matchGroup(roundName,location){const {place,sched}=splitLoc(location);if(!place)return null;
  const gs=(S.groups||[]).filter(g=>locKey(g.name)===locKey(roundName)&&splitLoc(g.location).place===place);
  if(gs.length===1)return gs[0].id;const m=gs.filter(g=>AR(g.schedule)===sched);return m.length===1?m[0].id:null}
async function loadRef(){
  const [profiles,settings,courses,groups]=await Promise.all([
    Q(S.sb.from('profiles').select('*').order('name')),Q(S.sb.from('settings').select('*')),
    Q(S.sb.from('courses').select('*').order('name')),Q(S.sb.from('groups').select('*').order('start_date',{ascending:false,nullsFirst:false}))]);
  S.profiles=Object.fromEntries(profiles.map(p=>[p.id,p]));setTimeout(applyBrand);S.settings=Object.fromEntries(settings.map(s=>[s.key,s.value]));S.courses=courses;S.groups=groups;await loadSeats();
}

/* ================= auth ================= */
async function boot(){
  if(!CFG.SUPABASE_URL||!CFG.SUPABASE_ANON_KEY||!window.supabase){S.fatal=!window.supabase?"Couldn't load the app libraries. Check your internet connection and reload.":'Sales Desk is not connected to its database yet. Fill SUPABASE_URL and SUPABASE_ANON_KEY in config.js.';render();return}
  S.sb=supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  try{const {data}=await S.sb.from('settings').select('value').eq('key','brand').maybeSingle();if(data)S.brandPub=data.value}catch(_){}
  applyBrand();
  S.sb.auth.onAuthStateChange((ev,session)=>{if(ev==='SIGNED_OUT'){S.session=null;S.me=null;render()}});
  const {data:{session}}=await S.sb.auth.getSession();
  if(session){S.session=session;await enter()}else{await checkAdmin();render()}
}
async function checkAdmin(){try{const {data}=await S.sb.rpc('has_admin');S.hasAdmin=!!data}catch(_){S.hasAdmin=true}}
async function enter(){
  S.booting=true;render();
  try{
    const uid=S.session.user.id;
    const {data:me,error}=await S.sb.from('profiles').select('*').eq('id',uid).maybeSingle();
    if(error)throw error;
    if(!me){S.authMsg="This account doesn't have access to this system. Ask your admin to add you.";await S.sb.auth.signOut();S.booting=false;await checkAdmin();render();return}
    if(!me.active){S.authMsg='Your account has been deactivated. Contact your admin.';await S.sb.auth.signOut();S.booting=false;render();return}
    S.me=me;await loadRef();S.me=S.profiles[uid]||me;
    const h=location.hash.slice(1);S.view=h||(me.role==='agent'?'leads':me.role==='ops'?'rounds':'dashboard');
  }catch(e){console.error(e);S.authMsg=errMsg(e)}
  S.booting=false;render();loadView();checkReminders(true);
}
async function doLogin(){
  const email=$('#lg-email').value.trim(),pw=$('#lg-pw').value;if(!email||!pw){toast('Enter your email and password');return}
  S.authBusy=true;S.authMsg='';render();
  const {data,error}=await S.sb.auth.signInWithPassword({email,password:pw});
  S.authBusy=false;
  if(error){S.authMsg=/banned/i.test(error.message)?'Your account has been deactivated. Contact your admin.':/Invalid login/i.test(error.message)?'Wrong email or password.':errMsg(error);render();return}
  S.session=data.session;await enter();
}
async function doSetup(){
  const name=$('#su-name').value.trim(),email=$('#su-email').value.trim(),phone=$('#su-phone').value.trim(),pw=$('#su-pw').value;
  if(!name||!email||pw.length<8){toast('Fill your name and email, and a password of 8+ characters');return}
  S.authBusy=true;render();
  try{
    const {data,error}=await S.sb.auth.signUp({email,password:pw});if(error)throw error;
    if(!data.session){const r=await S.sb.auth.signInWithPassword({email,password:pw});if(r.error)throw new Error('Account created, but sign-in failed: '+r.error.message+'. Turn off "Confirm email" in Supabase (see the setup guide), then try again.');S.session=r.data.session}else S.session=data.session;
    const {error:e2}=await S.sb.rpc('claim_first_admin',{p_name:name,p_phone:normPhone(phone)||phone});if(e2)throw e2;
    S.authBusy=false;await enter();
  }catch(e){S.authBusy=false;S.authMsg=errMsg(e);render()}
}
async function logout(){await S.sb.auth.signOut();S.me=null;S.rem=null;S.session=null;S.d={};location.hash='';await checkAdmin();render()}

/* ================= render ================= */
function render(){
  const root=$('#root');const ae=document.activeElement;const fid=ae&&ae.id&&root.contains(ae)?ae.id:null;let ss=null;try{ss=fid?ae.selectionStart:null}catch(_){}
  root.innerHTML=view();
  if(fid){const el=document.getElementById(fid);if(el){el.focus();try{if(ss!=null)el.setSelectionRange(ss,ss)}catch(_){}}}
}
function view(){
  if(S.fatal)return `<div class="center"><div class="card">${brandHead()}<p>${esc(S.fatal)}</p></div></div>`;
  if(!S.sb||S.booting)return `<div class="center"><div class="card">${brandHead()}<p class="hint"><span class="spin"></span> Loading…</p></div></div>`;
  if(!S.me)return authView();
  const me=S.me;
  const navs=me.role==='ops'?[['rounds','Rounds']]:me.role==='agent'?[['leads','My Leads'],['reports','Daily Reports'],['reservations','My Reservations'],['dashboard','My Numbers'],['attendance','My Shifts']]:
    me.role==='tl'?[['dashboard','Dashboard'],['leads','Team Leads'],['import','Import Leads'],['reservations','Reservations'],['reports','Daily Reports'],['interns','Interviews'],['attendance','Shifts & Deductions']]:
    [['dashboard','Dashboard'],['leads','All Leads'],['import','Import Leads'],['reservations','Reservations'],['reports','Daily Reports'],['interns','Interviews'],['rounds','Rounds'],['attendance','Shifts & Deductions'],['team','Team & Accounts'],['config','Settings']];
  if(me.role!=='admin'&&me.role!=='ops'&&me.rounds_access)navs.push(['rounds','Rounds']);
  if(!navs.find(n=>n[0]===S.view))S.view=navs[0][0];
  const showPeriod=['dashboard','leads','reservations'].includes(S.view)||(S.view==='reports'&&S.rf.tab==='sum');
  return `<div class="app">
  <aside class="rail" id="rail"><div class="brand"><img src="${esc(logoSrc())}" alt=""><div><b>${esc(brand().name)}</b><span>${esc(brand().sub)}</span></div></div>
   <nav class="nav">${navs.map(([k,t])=>`<a href="#${k}" class="${S.view===k?'on':''}">${t}${k==='leads'&&S.rem&&S.rem.n?` <span class="nbadge" title="Call-backs / follow-ups due now">${S.rem.n}</span>`:''}</a>`).join('')}</nav>
   <div class="me"><div><b class="ar">${esc(me.name)}</b>${ROLES[me.role]}</div><button data-act="pw-mine">Change my password</button><button data-act="logout">Sign out</button></div></aside>
  <div class="main">
   <div class="top"><button class="btn sm menu-btn" data-act="menu" aria-label="Menu">☰</button>
    ${showPeriod?`<select class="inp" id="period" data-ch="period" aria-label="Period">${PERIODS.map(([k,t])=>`<option value="${k}" ${S.period===k?'selected':''}>${t}</option>`).join('')}</select>`:''}
    <div class="sp"></div>${S.loading?'<span class="spin" aria-label="Loading"></span>':''}<button class="btn sm" data-act="refresh">Refresh</button></div>
   <div class="page">${({dashboard:dashView,leads:leadsView,import:importView,reservations:resView,reports:reportsView,interns:internsView,attendance:attView,team:teamView,config:settingsView,rounds:roundsView}[S.view]||dashView)()}</div>
  </div></div>`;
}
/* ===== reminders: the agent's own follow-ups / call-backs whose time has come ===== */
function remBar(){const R=S.rem;if(!R||!R.n||R.hidden===R.sig)return '';
  const canAsk=typeof Notification!=='undefined'&&Notification.permission==='default';
  return `<div class="rembar" role="alert"><b>⏰ ${plural(R.n,'call-back')} due now</b><span class="ar">${R.list.slice(0,3).map(l=>`${esc(l.name||l.phone)} (${l.status==='Call Later'?'call later':'follow-up'} ${esc(fuLabel(l))})`).join(' · ')}${R.n>3?' …':''}</span><div class="sp"></div>
   ${canAsk?'<button class="btn sm" data-act="rem-alerts">Turn on pop-up alerts</button>':''}<button class="btn sm pri" data-act="rem-open">Show them</button><button class="btn sm" data-act="rem-hide" aria-label="Hide until a new one is due">Hide</button></div>`}
async function checkReminders(force){
  if(!S.me||!S.sb||S.me.role==='ops'||S.me.active===false)return;
  let list;try{list=await Q(S.sb.from('leads').select('id,name,phone,status,follow_up,follow_up_at').eq('agent_id',S.me.id).or(dueOr()).not('status','in','("Reserved","Not Interested")').order('follow_up_at',{ascending:true,nullsFirst:false}).limit(50))}catch(e){console.warn(e);return}
  const old=S.rem||{seen:new Set()};const seen=old.seen||new Set();const fresh=list.filter(l=>!seen.has(l.id+'|'+(l.follow_up_at||l.follow_up)));
  fresh.forEach(l=>seen.add(l.id+'|'+(l.follow_up_at||l.follow_up)));
  const sig=list.map(l=>l.id).join(',');S.rem={n:list.length,list,seen,sig,hidden:old.hidden};
  if(false){const l=fresh[0];const msg=`⏰ Call back ${l.name||l.phone}${fresh.length>1?' and '+(fresh.length-1)+' more':''}`;toast(msg);
    try{if(typeof Notification!=='undefined'&&Notification.permission==='granted'){const n=new Notification('Call-back due',{body:`${l.name||l.phone} · ${l.status==='Call Later'?'call later':'follow-up'} ${fuLabel(l)}`,tag:'fu-'+l.id});n.onclick=()=>{window.focus();S.f.tab='due';location.hash='leads';loadView()}}}catch(_){}}
  if(force||old.n!==S.rem.n||old.sig!==sig){const ae=document.activeElement;if(!(ae&&['INPUT','TEXTAREA','SELECT'].includes(ae.tagName)&&!S.modal))render()}}
setInterval(()=>{if(!document.hidden)checkReminders(false)},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkReminders(false)});

  const setup=S.hasAdmin===false;
  return `<div class="center"><div class="card">${brandHead()}
  ${S.authMsg?`<div class="note bad">${esc(S.authMsg)}</div>`:''}
  ${setup?`<div class="note info">First-time setup: create the admin account. You'll add everyone else from inside the system.</div>
   <div class="field"><label for="su-name">Your name</label><input class="inp" id="su-name" autocomplete="name"></div>

async function loadView(){
  if(!S.me)return;if(S.me.role==='ops')S.view='rounds';if(S.view==='rounds'&&!hasRounds())S.view='dashboard';S.loading=true;render();
  try{const fn={dashboard:loadDash,leads:loadLeads,reservations:loadRes,groups:loadGroups,config:loadGroups,reports:loadReports,interns:loadInterns,attendance:loadAtt,team:loadTeam,rounds:loadRounds}[S.view];if(fn)await fn()}
  catch(e){console.error(e);toast(errMsg(e))}
  S.loading=false;render();
}

async function loadDash(){
  const [from,to]=periodRange();

const kpi=(t,v,s,alert)=>`<div class="kpi ${alert?'alert':''}"><span>${t}</span><b>${typeof v==='number'?nf(v):esc(v)}</b>${s?`<small>${esc(s)}</small>`:''}</div>`;
function barsOf(obj,isStatus){const e=Object.entries(obj).sort((a,b)=>b[1]-a[1]);const tot=e.reduce((s,x)=>s+x[1],0);if(!tot)return '<div class="empty">No data for this period</div>';
  return `<div class="bars">${e.map(([k,v])=>`<div><div class="l"><span>${isStatus?pill(k):esc(k)}</span><span class="num">${nf(v)} · ${pct(v,tot)}</span></div><div class="bar"><i style="width:${v*100/e[0][1]}%"></i></div></div>`).join('')}</div>`}
function resTrend(byDay,from,to){const n=Math.min(daysBetween(from,to),92);const days=[];for(let i=n-1;i>=0;i--)days.push(addDays(to,-i));const mx=Math.max(1,...days.map(d=>byDay[d]||0));
  if(!days.some(d=>byDay[d]))return '<div class="empty">No reservations in this period</div>';
  return `<div class="cols">${days.map(d=>`<div title="${fmtDay(d)}: ${byDay[d]||0}" style="height:${(byDay[d]||0)*100/mx}%"></div>`).join('')}</div><div class="cols-x"><span>${fmtDay(days[0])}</span><span>max ${mx} / day</span><span>${fmtDay(days[days.length-1])}</span></div>`}

function leadsQuery(sel,opts){
  let qb=S.sb.from('leads').select(sel,opts);const f=S.f;const [from,to]=periodRange();
  if(f.tab==='new')qb=qb.eq('status','New');
  else if(f.tab==='fu')qb=qb.lte('follow_up',today()).not('status','in','("Reserved","Not Interested")');
  else if(f.tab==='later')qb=qb.eq('status','Call Later');
  else if(f.tab==='res')qb=qb.eq('status','Reserved');
  if(f.tab==='all'&&!f.q.trim())qb=qb.gte('created_at',startISO(from)).lt('created_at',endISO(to));
  if(f.status)qb=qb.eq('status',f.status);
  if(f.course)qb=qb.eq('course',f.course);
  if(f.platform)qb=qb.eq('platform',f.platform);
  if(f.agent)qb=f.agent==='none'?qb.is('agent_id',null):qb.eq('agent_id',f.agent);
  const q=f.q.trim().replace(/[%,()*]/g,'');
  if(q){const d=q.replace(/\D/g,'').replace(/^0/,'');qb=qb.or(`name.ilike.*${q}*`+(d.length>=4?`,phone.ilike.*${d}*`:''))}
  return qb;
}
async function loadDue(agent){let q=S.sb.from('leads').select('*').or(dueOr()).not('status','in','("Reserved","Not Interested")').order('follow_up_at',{ascending:true,nullsFirst:false}).order('follow_up').limit(100);
  if(S.me.role==='agent')q=q.eq('agent_id',S.me.id);else if(agent)q=agent==='none'?q.is('agent_id',null):q.eq('agent_id',agent);
  const f=S.f;if(f.course)q=q.eq('course',f.course);if(f.platform)q=q.eq('platform',f.platform);return await Q(q)}
async function loadLeads(){
  const f=S.f;const fu=f.tab==='fu'||f.tab==='later';let qb=leadsQuery('*',{count:'exact'});
  qb=fu?qb.order('follow_up',{ascending:true}).order('follow_up_at',{ascending:true,nullsFirst:true}):qb.order('created_at',{ascending:false});
  const [r,due]=await Promise.all([Q(qb.range(f.page*PAGE,f.page*PAGE+PAGE-1)),
    /* call-backs whose time has come show on top of the new calls, flagged, until someone calls them */
    f.tab==='new'&&!f.page?loadDue(S.me.role==='agent'?null:f.agent):Promise.resolve([])]);
  S.d.leads={rows:r.data,count:r.count,due};
}

async function getLeadFull(id){
  const [lead,events,res]=await Promise.all([Q(S.sb.from('leads').select('*').eq('id',id).single()),Q(S.sb.from('lead_events').select('*').eq('lead_id',id).order('at')),Q(S.sb.from('reservations').select('*').eq('lead_id',id).order('created_at'))]);

function eventLine(e){

  else if(e.type==='reassigned')body=`Moved from <span class="ar">${esc(pname(d.from))}</span> to <span class="ar">${esc(pname(d.to))}</span>`;
  else if(e.type==='call')body=`Call · ${pill(e.status)}${d.qualified===true?' <span class="pill green">Qualified</span>':d.qualified===false?' <span class="pill red">Not qualified</span>':''}${d.reason?` <span class="pill">${esc(d.reason)}</span>`:''}${e.comment?`<div class="ar" dir="auto">${esc(e.comment)}</div>`:''}`;
  else if(e.type==='reserved')body=`<b>Reserved</b> ${esc(d.course||'')}${d.group_id?' · '+esc(groupName(d.group_id)):''} · ${egp(d.amount)} (${esc(d.payment||'')}, ${esc(d.method||'')}) · <span class="num">${esc(d.code||'')}</span>`;
  else if(e.type==='payment')body=`<b>Payment</b> ${egp(d.amount)} · ${esc(d.method||'')} · <span class="num">${esc(d.code||'')}</span>${e.comment?`<div class="ar" dir="auto">${esc(e.comment)}</div>`:''}`;
  else if(e.type==='refund')body=`<b style="color:var(--bad)">Refund</b> ${egp(d.amount)} · ${esc({overpaid:'paid more than the price',cancelled:'cancelled',other:'other'}[d.reason]||d.reason||'')} · ${esc(d.method||'')}${d.refund_phone?` to <span class="num">${esc(d.refund_phone)}</span>`:''}${d.refund_name?` (<span class="ar">${esc(d.refund_name)}</span>)`:''} · <span class="num">${esc(d.code||'')}</span>${d.closed?' · reservation closed':''}${d.refund_why?`<div class="ar" dir="auto"><b>Why:</b> ${esc(d.refund_why)}</div>`:''}${e.comment?`<div class="ar" dir="auto">${esc(e.comment)}</div>`:''}`;

  return `<div class="tl k-${esc(e.type)}"><div class="m">${fmtWhen(e.at)} · ${who}</div>${body}</div>`;

function impState(){if(!S.imp)S.imp={text:'',rows:[],fileName:'',platform:'',course:'',mode:'equal',agent:'',selected:new Set(myAgents().map(a=>a.id)),skipDup:true,busy:false,dups:new Set(),checking:false};return S.imp}
function parseTable(text){const lines=text.replace(/\r/g,'').split('\n').filter(l=>l.trim());if(!lines.length)return[];
  const f=lines[0];const d=f.includes('\t')?'\t':(f.split(';').length>f.split(',').length?';':',');
  return lines.map(line=>{const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];
    if(q){if(ch==='"'){if(line[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}else if(ch==='"')q=true;else if(ch===d){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out.map(s=>s.trim())});}
function rowsToLeads(rows){
  rows=rows.filter(r=>r&&r.some(c=>String(c??'').trim()));if(!rows.length)return[];
  const h=rows[0].map(x=>String(x??'').toLowerCase());
  let pi=h.findIndex(x=>/mobile|phone|number|رقم|موبايل|تليفون|هاتف|whats/.test(x));let ni=h.findIndex(x=>/name|اسم/.test(x));let ci=h.findIndex(x=>/city|gov|محافظ|مدينة/.test(x));let start=1;
  if(pi<0){start=0;pi=rows[0].findIndex(c=>normPhone(c));if(pi<0)pi=1;ni=pi===0?1:0}
  if(ni<0)ni=pi===0?1:0;
  return rows.slice(start).map(r=>{const raw=String(r[pi]??'').trim();return {name:String(r[ni]??'').trim()||'Unknown',raw,phone:normPhone(raw),city:ci>=0?String(r[ci]??'').trim():''}}).filter(r=>r.raw||r.name!=='Unknown');
}
async function checkDups(){const s=impState();const phones=[...new Set(s.rows.map(r=>r.phone).filter(Boolean))];s.dups=new Set();s.checking=true;render();
  try{for(let i=0;i<phones.length;i+=150){const d=await Q(S.sb.from('leads').select('phone').in('phone',phones.slice(i,i+150)));d.forEach(x=>s.dups.add(x.phone))}}catch(e){toast(errMsg(e))}
  s.checking=false;render()}

async function doImport(){
  const s=impState();const {good,plan}=S._imp||{};if(!good||!good.length)return;
  s.busy=true;render();const at=nowISO();const rowsOut=[];let i=0;
  for(const [aid,n] of Object.entries(plan)){good.slice(i,i+n).forEach(r=>rowsOut.push({name:r.name,phone:r.phone,city:normGov(r.city)||null,course:s.course,platform:s.platform,status:'New',agent_id:aid==='none'?null:aid,assigned_at:aid==='none'?null:at,created_by:S.me.id}));i+=n}
  const ok=await guard(async()=>{for(let k=0;k<rowsOut.length;k+=500){const ins=await Q(S.sb.from('leads').insert(rowsOut.slice(k,k+500)).select('id,agent_id,course,platform'));
      await Q(S.sb.from('lead_events').insert(ins.map(x=>({lead_id:x.id,type:'created',by:S.me.id,data:{platform:x.platform,course:x.course,agent_id:x.agent_id}}))))}},`Imported and distributed ${plural(rowsOut.length,'lead')} ✓`);
  s.busy=false;if(ok)S.imp=null;render();
}
async function readFile(file){
  const s=impState();s.fileName=file.name;
  try{if(/\.(xlsx|xls)$/i.test(file.name)){if(!window.XLSX){toast("The Excel reader didn't load. Save the sheet as CSV or paste it.");return}
      const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];s.rows=rowsToLeads(XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''}));s.text=''}

  render();checkDups();
}

async function systemCounts(agent,d){
  const [ev,leadsIn]=await Promise.all([all(()=>S.sb.from('lead_events').select('lead_id,type,status,data,at').eq('by',agent).in('type',['call','reserved']).gte('at',startISO(d)).lt('at',endISO(d)).order('at')),
    Q(S.sb.from('leads').select('id',{count:'exact',head:true}).eq('agent_id',agent).gte('assigned_at',startISO(d)).lt('assigned_at',endISO(d)))]);
  const by={};ev.filter(e=>e.type==='call').forEach(e=>(by[e.lead_id]=by[e.lead_id]||[]).push(e));
  const r={received:leadsIn.count||0,calls:0,noAnswer:0,wp:0,q:0,nq:0,res:ev.filter(e=>e.type==='reserved').length,twice:true};
  Object.values(by).forEach(cs=>{r.calls+=cs.length;if(cs.length>2)r.twice=false;const last=cs[cs.length-1];if(NO_REACH.includes(last.status))r.noAnswer++;if(cs.some(c=>c.status==='Send Details WP'))r.wp++;const q=last.data&&last.data.qualified;if(q===true)r.q++;else if(q===false)r.nq++});
  return r;
}

  let place=w.slice(0,i).join(' ');place=PLACE_ALIAS[place]||place;return {place,sched:w.slice(i).join(' ')}}

  const P={};ents.forEach(e=>{const {place,sched}=splitLoc(e.location);if(!place)return;const p=P[place]=P[place]||{n:0,sch:{},lab:{}};p.n++;if(sched)p.sch[sched]=(p.sch[sched]||0)+1;const l=locKey(e.location);p.lab[l]=(p.lab[l]||0)+1});

function parseCSV(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}return rows}
const clean=s=>String(s??'').replace(/[‎‏‪-‮]/g,'').replace(/\s+/g,' ').trim();
function sheetLayout(rows){const data=rows.filter(r=>r.some(c=>clean(c)));const sample=data.slice(0,25);
  const isPhone=s=>digits(s).length>=9;const ph3=sample.filter(r=>isPhone(r[3])).length,ph1=sample.filter(r=>isPhone(r[1])).length;
  if(ph3>=ph1)return 'std';const num2=sample.filter(r=>/^\d+$/.test(clean(r[2]))).length;return num2>sample.length/2?'virtual':'ads'}
function rowToEntry(r,layout){const c=i=>clean(r[i]);let e;
  if(layout==='std')e={booked_on:c(0),ref:c(1),name:c(2),phone:c(3),deposit:c(4),received_on:c(5),agent:c(6),location:c(7),plan:c(8),notes:c(9),email:c(10),extra:r.slice(11).map(clean).filter(Boolean).join(' / ')};
  else if(layout==='virtual')e={name:c(0),phone:c(1),deposit:c(2),agent:c(3),location:c(4),plan:c(5),notes:c(6),extra:r.slice(7).map(clean).filter(Boolean).join(' / ')};
  else e={name:c(0),phone:c(1),agent:c(2),received_on:c(3),deposit:c(4),plan:c(5),notes:c(6),email:c(7),extra:r.slice(8).map(clean).filter(Boolean).join(' / ')};
  if(!e.name&&!digits(e.phone))return null;
  if(e.extra)e.notes=[e.notes,e.extra].filter(Boolean).join(' / ');delete e.extra;
  const dep=String(e.deposit||'').replace(/[^\d.]/g,'');e.deposit=dep===''?null:+dep;
  if(digits(e.phone).length===10&&/^1/.test(digits(e.phone))&&!/^0/.test(e.phone))e.phone='0'+e.phone;
  Object.keys(e).forEach(k=>{if(e[k]==='')e[k]=null});return e}

async function dedupeDeferred(){const ents=await all(()=>S.sb.from('round_entries').select('id,round_id,phone,status,notes'));const by={};let n=0;
  ents.forEach(e=>{const k=digits(e.phone);if(k.length>=8)(by[k]=by[k]||[]).push(e)});
  for(const a of Object.values(by)){const outs=a.filter(x=>x.status==='Deferred out'),keep=a.find(x=>x.status!=='Deferred out');if(!outs.length||!keep)continue;
    let notes=keep.notes||'';outs.forEach(o=>{if(o.notes&&!notes.includes(o.notes.split(' / ')[0]))notes=[o.notes,notes].filter(Boolean).join(' / ')});
    if(notes!==(keep.notes||''))await Q(S.sb.from('round_entries').update({notes}).eq('id',keep.id));await Q(S.sb.from('round_entries').delete().in('id',outs.map(o=>o.id)));n+=outs.length}

  const byKey=new Map(have.map(x=>[digits(x.phone)||('n:'+x.name),x]));const out=[];const fill=[];let skip=0;
  rows.forEach(raw=>{const e=rowToEntry(raw,layout);if(!e)return;const k=digits(e.phone)||('n:'+e.name);const h=byKey.get(k);
    if(h){skip++;const loc=locKey(e.location)||opts.fillLocation;if(!h.location&&loc&&h.id){h.location=loc;fill.push(h)}return}

function monthRange(m){const [y,mo]=m.split('-').map(Number);return [`${y}-${pad(mo)}-01`,dstr(new Date(y,mo,0))]}
const logTypes=()=>setting('log_types',[]);
const logType=k=>logTypes().find(t=>t.key===k)||{key:k,label:k,kind:'violation',deduct:0};
function reportDeadlineISO(d){const [h,m]=String(setting('report_deadline','23:00')).split(':').map(Number);const x=parseD(d);x.setHours(h||23,m||0,0,0);return x.toISOString()}
async function loadAtt(){
  if(!S.att.month)S.att.month=today().slice(0,7);if(!S.att.tab)S.att.tab='log';const [from,to]=monthRange(S.att.month);
  const [act,log,reps]=await Promise.all([Q(S.sb.rpc('activity_days',{p_from:from,p_to:to})),all(()=>S.sb.from('staff_log').select('*').gte('day',from).lte('day',to).order('created_at')),
    all(()=>S.sb.from('daily_reports').select('agent_id,report_date,created_at').gte('report_date',from).lte('report_date',to))]);
  S.d.att={from,to,act,log,reps};
}
function attData(){
  const D=S.d.att;const t=today();const days=[];for(let d=D.from;d<=D.to;d=addDays(d,1))days.push(d);
  const act={};D.act.forEach(a=>{(act[a.user_id]=act[a.user_id]||{})[a.day]=a.calls});
  const rep={};D.reps.forEach(r=>{(rep[r.agent_id]=rep[r.agent_id]||{})[r.report_date]=r.created_at});
  const people=visibleStaff().filter(p=>p.role!=='admin'&&p.start_date<=D.to&&(!p.end_date||p.end_date>=D.from)).sort((a,b)=>a.start_date.localeCompare(b.start_date)||a.name.localeCompare(b.name));
  return {days,people:people.map(p=>{
    const lg=D.log.filter(l=>l.user_id===p.id);const off=offDaysOf(p.id);
    const s={employed:0,off:0,leave:0,expected:0,present:0,absent:0,offWorked:0,reports:Object.keys(rep[p.id]||{}).length,missing:0,late:0,violations:0,deduct:0,calls:0,leaveTypes:{}};
    lg.forEach(l=>{s.deduct+=+l.deduction||0;if(l.kind==='violation')s.violations++});
    const byDay={};
    const cells=days.map(d=>{
      const entries=lg.filter(l=>l.day===d);const auto=[];
      const c={d,entries,auto,state:''};byDay[d]=c;
      if(d<p.start_date||(p.end_date&&d>p.end_date)){c.state='N';return c}
      if(d>t){c.state='F';return c}
      s.employed++;const a=act[p.id]&&act[p.id][d]!=null;if(a)s.calls+=act[p.id][d]||0;
      const lv=entries.find(l=>l.kind==='leave');
      if(lv){s.leave++;const lb=logType(lv.type).label;s.leaveTypes[lb]=(s.leaveTypes[lb]||0)+1;c.state='L';return c}
      const isOff=off.includes(parseD(d).getDay());
      if(isOff){s.off++;if(a){s.offWorked++;c.state='W'}else c.state='O'}
      else{s.expected++;if(a){s.present++;c.state='A'}else if(d===t)c.state='P';else{s.absent++;c.state='X'}}
      if(!isOff&&p.role==='agent'){const r=rep[p.id]&&rep[p.id][d];
        if(!r&&d<t){s.missing++;if(!entries.some(e=>e.type==='no_report'))auto.push('no_report')}
        else if(r&&r>reportDeadlineISO(d)){s.late++;if(!entries.some(e=>e.type==='late_report'))auto.push('late_report')}}
      return c;});
    const daySalary=p.salary?(+p.salary)/30:0;
    return {p,cells,byDay,s,daySalary,dedEGP:s.deduct*daySalary};})};
}
function attView(){

  const head=`<div class="head"><div><h1>${mine?'My Shifts':'Shifts & Deductions'}</h1><div class="sub">Leave, violations and deductions per day, plus the monthly summary for salaries. A day counts as worked when the person logged calls or added a report.</div></div><div class="sp"></div>

   ${people.map(({p,s,daySalary,dedEGP})=>`<tr><td data-l="Name"><b class="ar">${esc(p.name)}</b>${p.active?'':' <span class="pill red">Left</span>'}</td><td data-l="Start" class="num">${fmtDay(p.start_date)}</td><td data-l="End" class="num">${p.end_date?fmtDay(p.end_date):'—'}</td>
    <td class="n" data-l="Days employed">${s.employed}</td><td class="n" data-l="Weekly off">${s.off}<span class="s">${esc(offLabel(p.id))}</span></td><td class="n" data-l="Leave" title="${esc(Object.entries(s.leaveTypes).map(([k,v])=>k+': '+v).join(', '))}">${s.leave}${s.leave?`<span class="s">${esc(Object.entries(s.leaveTypes).map(([k,v])=>k+' '+v).join(', '))}</span>`:''}</td><td class="n" data-l="Working days">${s.expected}</td>

  else if(act==='in-open')internModal(id);
  else if(act==='in-create'){const v=readInternForm();if(!v.name){toast('Enter a name');return}const lid=$('#i-lead')?.value||null;
    const r=await guard(()=>Q(S.sb.from('interns').insert({...v,lead_id:lid,created_by:S.me.id}).select('id').single()),'Added ✓');if(r&&r.id){closeModal();await loadInterns();render();internModal(r.id)}}
  else if(act==='in-save'){const v=readInternForm();if(!v.name){toast('Enter a name');return}if(await guard(()=>Q(S.sb.from('interns').update({...v,updated_at:nowISO()}).eq('id',id)),'Saved ✓')){await loadInterns();render();internModal(id)}}
  else if(act==='in-attempt'){const res=$('#a-res').value,cm=$('#a-cm').value.trim();if(!res){toast('Pick a result');return}if(!cm&&res!=='noshow'){toast('Add your comments');return}
    if(await guard(async()=>{await Q(S.sb.from('intern_interviews').insert({intern_id:+id,date:$('#a-date').value||today(),interviewer:$('#a-by').value.trim(),result:res,comment:cm,created_by:S.me.id}));await Q(S.sb.from('interns').update({updated_at:nowISO()}).eq('id',id))},'Logged ✓')){await loadInterns();render();internModal(id)}}
  else if(act==='in-dec'){const k=a.dataset.k;const note=$('#i-dnote').value.trim();
    if(await guard(()=>Q(S.sb.from('interns').update({status:k,decision_note:note||null,decided_at:k==='pending'?null:nowISO(),updated_at:nowISO()}).eq('id',id)),'Decision saved ✓')){await loadInterns();render();internModal(id)}}
  else if(act==='in-agent'){const i=S.d.interns.find(x=>x.id===+id);S.modal={prefill:{name:i.name,phone:i.phone,intern:true,internId:i.id}};staffModal(null)}
  // team
  else if(act==='copy-link')copyText(location.origin+location.pathname);
  else if(act==='st-new'){S.modal=null;staffModal(null)}
  else if(act==='st-edit'){S.modal=null;staffModal(id)}
  else if(act==='gen-pw'){$('#s-pw').value=genPassword()}
  else if(act==='copy-cred')copyText(S._cred||'');
  else if(act==='st-save'){const mid=S.modal?.id;if(!mid)return createAccount();
    const name=$('#s-name').value.trim();if(!name){toast('Name is required');return}
    const v={name,phone:normPhone($('#s-phone').value)||$('#s-phone').value.trim()||null,tl_id:$('#s-tl').value||null,start_date:$('#s-start').value||today(),salary:$('#s-salary').value===''?null:+$('#s-salary').value,notes:$('#s-notes').value.trim()||null,rounds_access:$('#s-rounds').checked};
    if(mid!==S.me.id)v.role=$('#s-role').value;
    if(await guard(()=>Q(S.sb.from('profiles').update(v).eq('id',mid)),'Saved ✓')){await loadRef();closeModal();render()}}
  else if(act==='st-deactivate'){const d=$('#s-end').value||today();if(await guard(()=>Q(S.sb.rpc('admin_set_active',{p_user:id,p_active:false,p_date:d})),'Account deactivated ✓')){await loadRef();closeModal();render()}}
  else if(act==='st-activate'){if(await guard(()=>Q(S.sb.rpc('admin_set_active',{p_user:id,p_active:true,p_date:null})),'Account reactivated ✓')){await loadRef();closeModal();render()}}
  else if(act==='st-setpw'){const pw=$('#s-newpw').value.trim();if(pw.length<8){toast('Use at least 8 characters');return}if(await guard(()=>Q(S.sb.rpc('admin_set_password',{p_user:id,p_password:pw})),'Password set ✓ — send it to them'))$('#s-newpw').value=''}
  // shifts & deductions
  else if(act==='att-tab'){S.att.tab=a.dataset.k;render()}
  else if(act==='att-who'){S.att.who=id;render()}
  else if(act==='log-cell')logCellModal(id,a.dataset.d);
  else if(act==='log-add'){const ty=$('#lg-type').value;await addLog(ty,$('#lg-note').value.trim(),$('#lg-ded').value,$('#lg-to').value)}
  else if(act==='log-auto'){const k=a.dataset.k;await addLog(k,'Flagged by the system',logType(k).deduct,'')}
  else if(act==='log-del'){const m=S.modal;if(await guard(()=>Q(S.sb.from('staff_log').delete().eq('id',id)),'Removed ✓')){await loadAtt();render();logCellModal(m.uid,m.d)}}
  else if(act==='att-csv'){const {days,people}=attData();const rows=[['Name','Start','End','Days employed','Weekly off','Leave','Working days','Worked','Absent','Reports','Missing reports','Late reports','Violations','Deduction days','Salary','Deduction EGP','Net']];
    people.forEach(({p,s,daySalary,dedEGP})=>rows.push([p.name,p.start_date,p.end_date||'',s.employed,s.off,s.leave,s.expected,s.present,s.absent,s.reports,s.missing,s.late,s.violations,s.deduct,p.salary||'',daySalary?Math.round(dedEGP):'',p.salary?Math.round(p.salary-dedEGP):'']));
    rows.push([]);rows.push(['Daily log']);rows.push(['Date',...people.map(x=>x.p.name+' '+dm(x.p.start_date))]);
    days.forEach(d=>rows.push([d,...people.map(({byDay})=>{const c=byDay[d];return c.state==='N'?'':[...c.entries.map(e=>logType(e.type).label+(e.note?': '+e.note:'')+(+e.deduction?' (-'+e.deduction+')':'')),...c.auto.map(k=>logType(k).label+' (system)')].join(' + ')})]));
    csvDownload('shifts-deductions-'+S.att.month+'.csv',rows)}
  // settings
  else if(act==='course-new'){if(await guard(()=>Q(S.sb.from('courses').insert({name:'New course '+(S.courses.length+1)})),'Course added — rename it and save')){await loadRef();render()}}
  else if(act==='course-save'){const v={name:$('#co-n-'+id).value.trim(),price:$('#co-p-'+id).value===''?null:+$('#co-p-'+id).value,active:$('#co-a-'+id).checked};if(!v.name)return;if(await guard(()=>Q(S.sb.from('courses').update(v).eq('id',id)),'Saved ✓')){await loadRef();clearDirty(a)}}
  else if(act==='group-new'){if(!S.courses.length){toast('Add a course first');return}if(await guard(()=>Q(S.sb.from('groups').insert({course:S.courses[0].name,name:'Round '})),'Group added — fill it in and save')){await loadRef();render()}}
  else if(act==='group-save'){const v={course:$('#gr-c-'+id).value,name:$('#gr-n-'+id).value.trim(),location:$('#gr-l-'+id).value.trim()||null,start_date:$('#gr-s-'+id).value||null,capacity:$('#gr-k-'+id).value===''?null:+$('#gr-k-'+id).value,active:$('#gr-a-'+id).checked};if(!v.name)return;if(await guard(()=>Q(S.sb.from('groups').update(v).eq('id',id)),'Saved ✓')){await loadRef();render()}}
  else if(act==='br-default'){S.brandLogo='';$('#br-prev').src=DEFAULT_LOGO}
  else if(act==='br-save'){const cur=brand();const v={name:$('#br-name').value.trim()||'Sales Department',sub:$('#br-sub').value.trim(),logo:S.brandLogo!=null?S.brandLogo:(S.settings.brand&&S.settings.brand.logo)||''};
    if(await guard(()=>Q(S.sb.from('settings').upsert([{key:'brand',value:v}])),'Branding saved ✓')){S.brandLogo=null;S.brandPub=v;S.settings.brand=v;applyBrand();clearDirty(a);if(!document.querySelector('[data-sv].dirty'))render()}}
  else if(act==='lt-new'){markDirty(a);$('#lt-body').insertAdjacentHTML('beforeend',`<tr data-key=""><td><input class="inp lt-label" placeholder="e.g. Late to shift" aria-label="Name"></td><td><select class="inp lt-kind" aria-label="Kind"><option value="violation">Violation</option><option value="leave">Leave</option></select></td><td><input type="number" step="0.25" min="0" class="inp num lt-ded" value="0" style="width:110px" aria-label="Deduction"></td><td><button class="btn sm ghost" data-act="lt-del" aria-label="Remove">✕</button></td></tr>`)}
  else if(act==='lt-del'){markDirty(a);a.closest('tr').remove()}
  else if(act==='sv'){const k=a.dataset.k;const lines=q=>$(q).value.split('\n').map(x=>x.trim()).filter(Boolean);let value;
    if(k==='platforms'){value=lines('#set-platforms');if(!value.length){toast('Add at least one channel');return}}
    else if(k==='checklist')value=lines('#set-check');
    else if(k==='report_deadline')value=$('#set-deadline').value||'23:00';
    else if(k==='log_types'){value=[...document.querySelectorAll('#lt-body tr')].map(tr=>{const label=tr.querySelector('.lt-label').value.trim();return {key:tr.dataset.key||label.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')||('t'+Date.now()),label,kind:tr.querySelector('.lt-kind').value,deduct:+tr.querySelector('.lt-ded').value||0}}).filter(t=>t.label);
      document.querySelectorAll('#lt-body tr').forEach((tr,n)=>{if(!tr.dataset.key&&value[n])tr.dataset.key=value[n].key})}
    else return;
    if(await guard(()=>Q(S.sb.from('settings').upsert([{key:k,value}])),'Saved ✓')){S.settings[k]=value;clearDirty(a)}}
  else if(act==='off-save'||act==='off-def-save'){
    const fresh=await Q(S.sb.from('settings').select('*').in('key',['staff_off','weekly_off']));if(fresh==null)return;fresh.forEach(r=>S.settings[r.key]=r.value);
    let row;if(act==='off-save'){const v=$('#off-'+id).value;const m=Object.assign({},staffOff());if(v==='def')delete m[id];else m[id]=v==='none'?[]:[+v];row={key:'staff_off',value:m}}
    else{const v=$('#off-def').value;row={key:'weekly_off',value:v==='none'?[]:[+v]}}
    if(await guard(()=>Q(S.sb.from('settings').upsert([row])),'Day off saved ✓')){S.settings[row.key]=row.value;S.d.att=null;clearDirty(a)}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal-root').innerHTML)closeModal()});
document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.remove('over');const f=e.dataTransfer.files[0];if(f)readFile(f)}});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(S.me&&h&&h!==S.view){S.view=h;closeModal();$('#rail')?.classList.remove('open');render();loadView()}});
boot();
</script>
</body>
</html>
